apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: can-i-openshell
    ai-factory.suse.com/blueprint-version: 1.1.1
  name: can-i-openshell-1-1-1
spec:
  source: Custom  # community, unsupported demo
  displayName: can-i in an OpenShell sandbox
  version: 1.1.1
  description: |
    Shows what an AI agent can and can't do inside an NVIDIA OpenShell 0.1.5
    sandbox, and how that changes as you grant access. can-i runs as the
    sandbox workload; its dashboard flips ALLOWED/DENIED live as the policy
    changes.

    Three components, three pods plus the sandbox:
      - agent-sandbox       Agent Sandbox CRD + controller (agent-sandbox-system)
      - openshell-gateway   OpenShell gateway (control plane, svc/openshell)
      - can-i               client pod: creates the can-i sandbox from the chosen
                            image (SUSE BCI, openSUSE Leap 16 or NVIDIA Ubuntu)
                            and serves its dashboard

    Prerequisites on the target cluster: Landlock enabled in the kernel of
    every node that runs sandboxes (docs/landlock/README.md in the can-i repo),
    a CNI that enforces NetworkPolicy
    (RKE2's Canal/Calico/Cilium do), a default StorageClass for the gateway
    database, and no earlier Agent Sandbox install (kubectl apply of
    sandbox.yaml) that Helm would conflict with.

    1.1.0 added a Policy profile dropdown for can-i (custom, locked-down,
    suse-only, web-read, agent-installer, everything) and grants you can tick
    on top of any profile (opensuse, cloudflare, pypi, susePypi, nmap,
    agentTools, varTmp), plus extra network rules as YAML. Set them in the YAML
    tab of the Customize step, under the can-i component's values, e.g.
      policy:
        profile: web-read
        grants: {pypi: true}

    1.1.1: ticking every grant now installs. The susePypi grant is skipped while
    checks.susePypiUrl is blank (1.1.0 failed the install).
  components:
    # Install everything into one namespace: can-i reads the gateway's
    # openshell-client-tls Secret and calls https://openshell:8080.
    # agent-sandbox and openshell-gateway come from wiredquill/openshell
    # (ClusterRepo wiredquill-openshell); only can-i is published from this repo.
    - chartName: agent-sandbox
      chartRepo: wiredquill-openshell
      chartVersion: "1.0.11"
      releaseName: agent-sandbox
    - chartName: openshell-gateway
      chartRepo: wiredquill-openshell
      chartVersion: "0.1.9"
      releaseName: openshell
      values:
        openshell:
          agentSandbox:
            preflight:
              # The components install in parallel, so the Agent Sandbox CRDs
              # may not be served yet when this renders; skip the render-time
              # check instead of failing the bundle.
              enabled: false
    - chartName: can-i
      chartRepo: suse-tm-can-i
      chartVersion: "0.2.1"
      releaseName: can-i
      values:
        sandbox:
          image: suse
        service:
          type: NodePort
