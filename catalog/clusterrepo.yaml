# Register on each cluster that installs these charts (Apps and SUSE AI Factory both
# read it). Blueprints reference it as chartRepo: suse-tm-can-i.
apiVersion: catalog.cattle.io/v1
kind: ClusterRepo
metadata:
  name: suse-tm-can-i
spec:
  gitRepo: https://github.com/SUSE-Technical-Marketing/can-i
  gitBranch: aif/charts
