# The can-i chart. Register on each cluster that installs it, together with
# wiredquill-openshell (agent-sandbox, openshell-gateway); see the README. The
# blueprint references both by name (chartRepo: suse-tm-can-i / wiredquill-openshell).
apiVersion: catalog.cattle.io/v1
kind: ClusterRepo
metadata:
  name: suse-tm-can-i
spec:
  gitRepo: https://github.com/SUSE-Technical-Marketing/can-i
  gitBranch: aif/charts
