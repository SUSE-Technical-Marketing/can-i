questions:
- variable: sandbox.image
  label: Sandbox image
  group: Sandbox
  type: enum
  default: suse
  required: true
  options:
    - suse
    - opensuse
    - nvidia
    - custom
  description: >-
    The OpenShell child container can-i runs in.
    suse = SUSE BCI (ghcr.io/suse-technical-marketing/can-i),
    opensuse = openSUSE Leap 16.0 (ghcr.io/suse-technical-marketing/can-i-opensuse),
    nvidia = NVIDIA base Ubuntu 24.04, the OpenShell chart's default sandbox base (ghcr.io/suse-technical-marketing/can-i-nvidia),
    custom = your own image below.
    Changing it recreates the sandbox.
- variable: sandbox.customImage
  label: Custom sandbox image
  group: Sandbox
  type: string
  default: ""
  show_if: "sandbox.image=custom"
  required: true
  description: Full image reference. It must contain can-i and a user with uid 10001.
- variable: sandbox.name
  label: Sandbox name
  group: Sandbox
  type: string
  default: can-i-sandbox
  required: true
  description: Name in OpenShell, used by openshell sandbox connect and openshell policy update.
- variable: sandbox.gpu
  label: Request a GPU
  group: Sandbox
  type: boolean
  default: false
  description: Ask OpenShell for a GPU for the sandbox. Needs a GPU node and a matching RuntimeClass on the gateway.
- variable: sandbox.recreate
  label: Recreate the sandbox when the app restarts
  group: Sandbox
  type: boolean
  default: true
  description: On, changes to the image or policy here take effect on upgrade. Off, a running sandbox is reused and keeps policy changes made with the CLI.

- variable: policy.profile
  label: Policy profile
  group: Starting policy
  type: enum
  default: custom
  options:
    - custom
    - locked-down
    - suse-only
    - web-read
    - agent-installer
    - everything
  description: >-
    The starting policy, one demo scene each. custom: the egress list and grants below, as set (the default).
    locked-down: no network at all. suse-only: curl reaches suse.com. web-read: plus opensuse.org and one.one.one.one.
    agent-installer: plus python reading PyPI, the way an agent installs packages. everything: every probe a policy
    can grant is ALLOWED. The grants and extra lines below are added to any profile. Network rules can also be
    changed live with openshell policy update.
- variable: policy.grants.opensuse
  label: Grant curl to opensuse.org
  group: Starting policy
  type: boolean
  default: false
  description: Adds opensuse.org:443 to curl's egress rule.
- variable: policy.grants.cloudflare
  label: Grant curl to one.one.one.one
  group: Starting policy
  type: boolean
  default: false
  description: Flips the "HTTPS to one.one.one.one" probe to ALLOWED.
- variable: policy.grants.pypi
  label: Grant python to PyPI
  group: Starting policy
  type: boolean
  default: false
  description: Lets python reach pypi.org and files.pythonhosted.org, so "Upstream PyPI" turns ALLOWED.
- variable: policy.grants.susePypi
  label: Grant python to the SUSE PyPI index
  group: Starting policy
  type: boolean
  default: false
  description: Lets python reach the host of the SUSE PyPI index URL below. Set that URL too.
- variable: policy.grants.nmap
  label: Grant nmap to suse.com
  group: Starting policy
  type: boolean
  default: false
  description: Gives nmap its own rule for suse.com:443, so the port-scan probe turns ALLOWED.
- variable: policy.grants.agentTools
  label: Grant /srv/can-i-tools
  group: Starting policy
  type: boolean
  default: false
  description: Adds /srv/can-i-tools to the read-only paths, so the unapproved-tool probe can run. Fixed when the sandbox is created.
- variable: policy.grants.varTmp
  label: Grant write to /var/tmp
  group: Starting policy
  type: boolean
  default: false
  description: Adds /var/tmp to the read-write paths. Fixed when the sandbox is created.
- variable: policy.egress
  label: Allowed egress (curl)
  group: Starting policy
  type: string
  default: "suse.com:443"
  show_if: "policy.profile=custom"
  description: >-
    Comma-separated host:port that /usr/bin/curl may reach, e.g. suse.com:443,opensuse.org:443. Used by the custom
    profile; the other profiles set their own. Leave blank to start with all network access denied. Network rules can also be changed live with
    openshell policy update.
- variable: policy.extraReadOnly
  label: Extra read-only paths
  group: Starting policy
  type: string
  default: ""
  description: Comma-separated paths added to filesystem_policy.read_only.
- variable: policy.extraReadWrite
  label: Extra read-write paths
  group: Starting policy
  type: string
  default: ""
  description: Comma-separated paths added to filesystem_policy.read_write.

- variable: policy.extraYaml
  label: Extra network rules (YAML)
  group: Starting policy
  type: multiline
  default: ""
  description: >-
    Whole network_policies rules for anything the grants can't say, as a map of rule name to rule (endpoints and
    binaries), added last. Give each binary its own rule. Changing any policy option recreates the sandbox.

- variable: checks.susePypiUrl
  label: SUSE PyPI index URL
  group: Checks
  type: string
  default: ""
  description: >-
    A URL on SUSE's package index for the "SUSE PyPI (python)" check, for example a project page
    under its /simple/ path. Next to the upstream PyPI check, it lets a demo switch the sandbox
    between the two indexes with openshell policy update. Leave blank to hide the check.

- variable: gateway.endpoint
  label: OpenShell gateway endpoint
  group: OpenShell gateway
  type: string
  default: https://openshell:8080
  description: The openshell-gateway app's Service. Install can-i in the same namespace.
- variable: gateway.tlsSecret
  label: Gateway client certificate Secret
  group: OpenShell gateway
  type: string
  default: openshell-client-tls
  description: Created by the openshell-gateway app in its namespace.

- variable: service.type
  label: Dashboard Service type
  group: Dashboard
  type: enum
  default: NodePort
  options: [ClusterIP, NodePort, LoadBalancer]
  description: >-
    How browsers outside the cluster reach the dashboard. The sandbox itself has no inbound network:
    this app's client pod forwards the dashboard out of it through the gateway.
    For ClusterIP use the Ingress below or kubectl port-forward.
- variable: service.nodePort
  label: NodePort
  group: Dashboard
  type: int
  default: ""
  min: 30000
  max: 32767
  show_if: "service.type=NodePort"
  description: Blank = assigned by Kubernetes.
- variable: ingress.enabled
  label: Expose the dashboard with an Ingress
  group: Dashboard
  type: boolean
  default: false
  show_subquestion_if: true
  subquestions:
  - variable: ingress.host
    label: Hostname
    type: hostname
    default: can-i.example.com
  - variable: ingress.className
    label: Ingress class
    type: string
    default: ""
    description: Blank = the cluster's default IngressClass.
  - variable: ingress.tls
    label: TLS
    type: boolean
    default: false
    description: Serve HTTPS with the Secret <release>-tls (create it, or let cert-manager do it).

- variable: client.image.repository
  label: Client image
  group: Advanced
  type: string
  default: ghcr.io/suse-technical-marketing/can-i-client
- variable: client.image.tag
  label: Client image tag
  group: Advanced
  type: string
  default: latest
