# can-i as an OpenShell sandbox. A small client pod (the openshell CLI) creates
# the sandbox through the gateway, then forwards the dashboard to a Service.
# Install into the same namespace as the openshell-gateway chart.

sandbox:
  # Sandbox name in OpenShell (`openshell sandbox get <name>`). The sandbox pod,
  # which runs the workload and the OpenShell supervisor, is named after it.
  name: can-i-sandbox
  # Which can-i image the sandbox runs: suse | opensuse | nvidia | custom
  image: suse
  images:
    suse: ghcr.io/suse-technical-marketing/can-i:latest              # SUSE BCI Python 3.13
    opensuse: ghcr.io/suse-technical-marketing/can-i-opensuse:latest # openSUSE Leap 16.0
    nvidia: ghcr.io/suse-technical-marketing/can-i-nvidia:latest     # NVIDIA base Ubuntu 24.04
  # Used when image is "custom". Must contain can-i and a uid-10001 user.
  customImage: ""
  # Request a GPU for the sandbox (needs a GPU node and RuntimeClass).
  gpu: false
  # Delete and recreate the sandbox when the client pod restarts, so image and
  # policy changes in this form take effect. Off = reuse a running sandbox.
  recreate: true

# OpenShell policy for the sandbox: the grants can-i's probes need, nothing
# more. Everything the dashboard shows as DENIED is denied by omission.
policy:
  # Starting point, from policy-profiles.yaml:
  #   custom           policy.egress and the grants below, as set (the default)
  #   locked-down      no network at all
  #   suse-only        curl reaches suse.com (what can-i started with)
  #   web-read         + opensuse.org and one.one.one.one
  #   agent-installer  + python reading PyPI
  #   everything       every grantable probe is ALLOWED
  # Any profile can be widened with the grants and extra lines below.
  # `scripts/preview-policy.sh` prints the resulting policy before you deploy.
  profile: custom
  # Comma-separated host:port that /usr/bin/curl may reach (L4 + TLS). Used by the
  # custom profile; the others set their own.
  egress: "suse.com:443"
  # Extra comma-separated paths, e.g. "/data" (applied when the sandbox starts).
  extraReadOnly: ""
  extraReadWrite: ""
  # Must exist in the image; all can-i images ship user cani (10001).
  runAsUser: "10001"
  # Grants added to the profile (policy-grants.yaml); each flips a probe to ALLOWED.
  grants:
    opensuse: false     # curl -> opensuse.org:443
    cloudflare: false   # curl -> one.one.one.one:443
    pypi: false         # python -> pypi.org
    susePypi: false     # python -> the host of checks.susePypiUrl (skipped while that is blank)
    nmap: false         # nmap -> suse.com:443
    agentTools: false   # /srv/can-i-tools readable and runnable (needs a recreate)
    varTmp: false       # /var/tmp writable (needs a recreate)
  # Whole network_policies rules as YAML (a map of rule name to rule), added last.
  extraYaml: ""

checks:
  # A package index URL for the "SUSE PyPI (python)" check, e.g. a project
  # page under its /simple/ path. Blank hides the check.
  susePypiUrl: ""

gateway:
  # The openshell-gateway chart's Service and client certificate Secret.
  endpoint: https://openshell:8080
  tlsSecret: openshell-client-tls

client:
  image:
    repository: ghcr.io/suse-technical-marketing/can-i-client
    tag: latest
    pullPolicy: Always
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

service:
  # NodePort: the dashboard is on every node's IP without a port-forward.
  # ClusterIP (with the Ingress below) or LoadBalancer also work.
  type: NodePort
  port: 80
  # Only for NodePort; blank = assigned by Kubernetes.
  nodePort: ""

ingress:
  enabled: false
  className: ""
  host: can-i.example.com
  tls: false

imagePullSecrets: []
